<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="onevilx — Youssef Aboukir, security researcher, Casablanca. Credited on three GitHub security advisories.">
  <title>onevilx</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#121212"/><stop offset=".55" stop-color="#0b0b0b"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="slat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8a8c0" stop-opacity="0"/>
      <stop offset=".35" stop-color="#bdbdbd" stop-opacity=".17"/>
      <stop offset=".72" stop-color="#a8a8c0" stop-opacity=".05"/>
      <stop offset="1" stop-color="#a8a8c0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".78">
      <stop offset=".4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".72"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a6a6a" stop-opacity="0"/><stop offset="1" stop-color="#6a6a6a" stop-opacity=".55"/>
    </linearGradient>
    <filter id="n1" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="n2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="42"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="box"><rect width="920" height="220" rx="4"/></clipPath>
    <style><![CDATA[
      .ser{font-family:Georgia,"Times New Roman",Times,serif}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
      @keyframes grain{0%,49%{opacity:.095}50%,100%{opacity:0}}
      #gA{animation:grain .42s steps(1) infinite}
      #gB{animation:grain .42s steps(1) -.21s infinite}
      @keyframes slats{0%{transform:translate3d(-34px,0,0)}100%{transform:translate3d(34px,0,0)}}
      #blinds{animation:slats 19s ease-in-out infinite alternate}
      @keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}
      #dot{animation:breathe 4.6s ease-in-out infinite}
    ]]></style>
  </defs>

  <g clip-path="url(#box)">
    <rect width="920" height="220" fill="url(#bg)"/>

    <g id="blinds" opacity=".9">
      <g transform="rotate(-14 460 110)">
        <rect x="-120" y="-84" width="1160" height="26" fill="url(#slat)"/>
        <rect x="-120" y="-18" width="1160" height="20" fill="url(#slat)"/>
        <rect x="-120" y="46" width="1160" height="30" fill="url(#slat)"/>
        <rect x="-120" y="124" width="1160" height="18" fill="url(#slat)"/>
        <rect x="-120" y="190" width="1160" height="26" fill="url(#slat)"/>
      </g>
    </g>

    <rect width="920" height="220" fill="url(#vig)"/>
    <rect id="gA" width="920" height="220" filter="url(#n1)"/>
    <rect id="gB" width="920" height="220" filter="url(#n2)"/>
  </g>

  <text class="ser" x="56" y="106" font-size="54" fill="#c4c4c4" letter-spacing="1.5">onevilx</text>
  <text class="sans" x="59" y="138" font-size="15" fill="#949494" letter-spacing=".2">Youssef Aboukir</text>
  <text class="sans" x="59" y="160" font-size="12.5" fill="#6a6a6a" letter-spacing=".3">security researcher &#183; Casablanca</text>

  <text class="sans" x="864" y="74" font-size="9.5" fill="#6a6a6a" letter-spacing="3.4" text-anchor="end">CREDITED</text>
  <path d="M612 84h252" stroke="url(#rule)" stroke-width="1"/>
  <text class="mono" x="864" y="110" font-size="11" text-anchor="end"><tspan fill="#a8a8a8">vuejs/core</tspan><tspan fill="#5e5e5e">  GHSA-g2v6-rqmx-r4w6</tspan></text>
  <text class="mono" x="864" y="132" font-size="11" text-anchor="end"><tspan fill="#a8a8a8">ip-range-check</tspan><tspan fill="#5e5e5e">  GHSA-87xc-4hwr-pxf6</tspan></text>
  <text class="mono" x="864" y="154" font-size="11" text-anchor="end"><tspan fill="#a8a8a8">nuxt-auth-utils</tspan><tspan fill="#5e5e5e">  GHSA-xc49-mgwh-9pjv</tspan></text>

  <circle id="dot" cx="59" cy="183" r="2.6" fill="#a8a8c0"/>
  <text class="mono" x="70" y="187" font-size="10.5" fill="#6a6a6a" letter-spacing=".6">onevilx.tech</text>

  <rect x=".5" y=".5" width="919" height="219" rx="4" fill="none" stroke="#242424"/>
</svg>
