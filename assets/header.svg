<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-label="onevilx — Youssef Aboukir, security researcher. The complete patch for GHSA-g2v6-rqmx-r4w6 in vuejs/core: one carriage return added to the unsafe attribute character class.">
  <title>onevilx — the entire patch</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787"/><stop offset=".5" stop-color="#58a6ff"/><stop offset="1" stop-color="#d2a8ff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950" stop-opacity=".5"/><stop offset=".5" stop-color="#58a6ff" stop-opacity=".4"/><stop offset="1" stop-color="#d2a8ff" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".2"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.4"/></filter>
    <style><![CDATA[
      .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
      .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .dim{fill:#8b949e}.faint{fill:#6e7681}.wht{fill:#e6edf3}
      .del{fill:#ff7b72}.add{fill:#3fb950}.blu{fill:#58a6ff}

      @keyframes tokIn{0%,6%{opacity:0;transform:translateY(-8px) scaleY(.35)}
                        14%,88%{opacity:1;transform:translateY(0) scaleY(1)}
                        96%,100%{opacity:0;transform:translateY(-8px) scaleY(.35)}}
      #tok{animation:tokIn 12s cubic-bezier(.2,.9,.25,1) infinite;transform-origin:800px 136px}
      @keyframes tokGlow{0%,6%{opacity:0}14%{opacity:.9}32%,100%{opacity:0}}
      #tokGlow{animation:tokGlow 12s ease-out infinite}

      @keyframes stA{0%,34%{opacity:1}44%,94%{opacity:0}100%{opacity:1}}
      @keyframes stB{0%,36%{opacity:0}46%,92%{opacity:1}98%,100%{opacity:0}}
      #stateA,#labA{animation:stA 12s ease-in-out infinite}
      #stateB,#labB{animation:stB 12s ease-in-out infinite}
      @keyframes cut{0%,35%{opacity:0;transform:scaleY(0)}
                      39%{opacity:1;transform:scaleY(1)}
                      54%{opacity:.5;transform:scaleY(1)}
                      72%,100%{opacity:0;transform:scaleY(1)}}
      #cut{animation:cut 12s ease-out infinite;transform-origin:513px 232px}
      @keyframes drift{0%,100%{opacity:.45}50%{opacity:1}}
      #halo1{animation:drift 11s ease-in-out infinite}
    ]]></style>
  </defs>

  <rect width="920" height="300" rx="14" fill="url(#bg)"/>
  <ellipse id="halo1" cx="180" cy="110" rx="260" ry="170" fill="url(#halo)"/>

  <text class="m" x="34" y="118" font-size="40" font-weight="700" fill="url(#mark)" letter-spacing="-1">onevilx</text>
  <text class="s wht" x="36" y="150" font-size="15.5">Youssef Aboukir</text>
  <text class="s dim" x="36" y="172" font-size="13.5">security researcher · 1337 / 42 Network</text>
  <path d="M36 196h150" stroke="#21262d"/>
  <circle cx="41" cy="218" r="4" fill="#3fb950"/>
  <text class="s wht" x="54" y="222" font-size="13.5">3 published GitHub advisories</text>
  <text class="s faint" x="54" y="242" font-size="12">all credited · all patched upstream</text>

  <path d="M372 44v212" stroke="#21262d"/>

  <text class="s faint" x="404" y="62" font-size="11" letter-spacing="1.6">THE ENTIRE PATCH</text>
  <text class="m blu" x="886" y="62" font-size="11" text-anchor="end">GHSA-g2v6-rqmx-r4w6</text>
  <text class="m faint" x="404" y="84" font-size="11">vuejs/core · packages/shared/src/domAttrConfig.ts</text>

  <rect x="404" y="94" width="482" height="21" rx="3" fill="#ff7b72" fill-opacity=".09"/>
  <rect x="404" y="94" width="2.5" height="21" fill="#ff7b72" fill-opacity=".5"/>
  <text class="m faint" x="414" y="109" font-size="10.5">36</text>
  <text class="m del" x="436" y="109" font-size="11">- const unsafeAttrCharRE = /[&gt;/="&apos;&#92;u0009&#92;u000a&#92;u000c&#92;u0020]/</text>

  <rect x="404" y="121" width="482" height="21" rx="3" fill="#3fb950" fill-opacity=".09"/>
  <rect x="404" y="121" width="2.5" height="21" fill="#3fb950" fill-opacity=".5"/>
  <text class="m faint" x="414" y="136" font-size="10.5">41</text>
  <text class="m add" x="436" y="136" font-size="11">+ const unsafeAttrCharRE = /[&gt;/="&apos;&#92;u0009&#92;u000a&#92;u000c</text>
  <rect id="tokGlow" x="778" y="123" width="44" height="17" rx="3" fill="#7ee787" filter="url(#soft)"/>
  <text id="tok" class="m" x="780.4" y="136" font-size="11" fill="#7ee787" font-weight="700">&#92;u000d</text>
  <text class="m add" x="820.2" y="136" font-size="11">&#92;u0020]/</text>

  <text class="s faint" x="404" y="168" font-size="11.5">whitespace to the regex · an attribute separator to a real HTML parser</text>

  <g id="stateA">
    <rect x="404" y="212" width="268" height="30" rx="5" fill="#161b22" stroke="#30363d"/>
    <text class="m" x="416" y="232" font-size="11.5"><tspan fill="#8b949e">&lt;div </tspan><tspan fill="#e6edf3">autofocus</tspan><tspan fill="#ff7b72" font-weight="700">&#92;r</tspan><tspan fill="#e6edf3">onfocus="alert(1)"</tspan><tspan fill="#8b949e">&gt;</tspan></text>
  </g>
  <g id="stateB">
    <rect x="404" y="212" width="88" height="30" rx="5" fill="#161b22" stroke="#3fb950" stroke-opacity=".55"/>
    <text class="m wht" x="416" y="232" font-size="11.5">autofocus</text>
    <rect x="524" y="212" width="150" height="30" rx="5" fill="#161b22" stroke="#d2a8ff" stroke-opacity=".55"/>
    <text class="m" x="536" y="232" font-size="11.5"><tspan fill="#d2a8ff">onfocus</tspan><tspan fill="#e6edf3">="alert(1)"</tspan></text>
  </g>
  <rect id="cut" x="512" y="204" width="2" height="46" fill="#ff7b72"/>

  <text id="labA" class="s faint" x="404" y="266" font-size="11.5">one attribute name, as the sanitizer read it</text>
  <text id="labB" class="s" x="404" y="266" font-size="11.5" fill="#8b949e">two attributes, as the browser built them — <tspan fill="#d2a8ff">it fires on load</tspan></text>

  <rect x=".5" y=".5" width="919" height="299" rx="14" fill="none" stroke="url(#edge)"/>
</svg>
