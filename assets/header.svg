<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-label="onevilx — security researcher. 3 published GitHub Security Advisories, all credited.">
  <title>onevilx — security researcher</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#58a6ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#d2a8ff" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#39d353" stop-opacity=".16"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58a6ff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0v22" fill="none" stroke="#c9d1d9" stroke-opacity=".035" stroke-width="1"/>
    </pattern>

    <clipPath id="c1"><rect class="r1" x="34" y="60" height="22" width="0"/></clipPath>
    <clipPath id="c2"><rect class="r2" x="34" y="90" height="22" width="0"/></clipPath>
    <clipPath id="c3"><rect class="r3" x="34" y="126" height="22" width="0"/></clipPath>
    <clipPath id="c4"><rect class="r4" x="34" y="156" height="22" width="0"/></clipPath>
    <clipPath id="c5"><rect class="r5" x="34" y="192" height="22" width="0"/></clipPath>
    <clipPath id="c6"><rect class="r6" x="34" y="222" height="22" width="0"/></clipPath>

    <style><![CDATA[
      .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:15px}
      .dim{fill:#6e7681}.usr{fill:#7ee787}.sgl{fill:#58a6ff}.cmd{fill:#e6edf3}
      .ok{fill:#7ee787}.info{fill:#58a6ff}.mag{fill:#d2a8ff}
      @keyframes k1{0%{width:0}7%{width:210px}95%{width:210px}100%{width:0}}
      @keyframes k2{0%,9%{width:0}19%{width:345px}95%{width:345px}100%{width:0}}
      @keyframes k3{0%,22%{width:0}30%{width:290px}95%{width:290px}100%{width:0}}
      @keyframes k4{0%,32%{width:0}46%{width:490px}95%{width:490px}100%{width:0}}
      @keyframes k5{0%,49%{width:0}58%{width:325px}95%{width:325px}100%{width:0}}
      @keyframes k6{0%,60%{width:0}74%{width:520px}95%{width:520px}100%{width:0}}
      .r1{animation:k1 16s steps(23) infinite}
      .r2{animation:k2 16s steps(38) infinite}
      .r3{animation:k3 16s steps(32) infinite}
      .r4{animation:k4 16s steps(54) infinite}
      .r5{animation:k5 16s steps(36) infinite}
      .r6{animation:k6 16s steps(57) infinite}
      @keyframes blink{0%,74%{opacity:0}75%,100%{opacity:1}}
      @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
      #cur{animation:blink 16s infinite,caret 1.06s steps(1) infinite}
      @keyframes sweep{0%{transform:translateY(-70px)}100%{transform:translateY(300px)}}
      #sl{animation:sweep 7s linear infinite}
      @keyframes pulse{0%,100%{opacity:.35;r:3}50%{opacity:1;r:4.2}}
      #live{animation:pulse 2.2s ease-in-out infinite}
      @keyframes drift{0%{opacity:.07}50%{opacity:.16}100%{opacity:.07}}
      #halo{animation:drift 9s ease-in-out infinite}
    ]]></style>
  </defs>

  <rect width="920" height="280" rx="12" fill="url(#panel)"/>
  <rect width="920" height="280" rx="12" fill="url(#grid)"/>
  <ellipse id="halo" cx="760" cy="40" rx="300" ry="190" fill="url(#glow)"/>
  <rect id="sl" width="920" height="70" fill="url(#scan)"/>

  <g>
    <circle cx="26" cy="22" r="5" fill="#ff7b72"/>
    <circle cx="44" cy="22" r="5" fill="#e3b341"/>
    <circle cx="62" cy="22" r="5" fill="#3fb950"/>
    <text class="mono dim" x="84" y="27" font-size="12.5">onevilx@1337: ~/research — zsh</text>
    <circle id="live" cx="836" cy="22" r="3.5" fill="#3fb950"/>
    <text class="mono dim" x="848" y="26" font-size="11" letter-spacing="1.2">LIVE</text>
    <path d="M14 42h892" stroke="#21262d" stroke-width="1"/>
  </g>

  <g class="mono" clip-path="url(#c1)">
    <text x="34" y="76"><tspan class="usr">onevilx</tspan><tspan class="dim">@1337</tspan><tspan class="sgl">:~$ </tspan><tspan class="cmd">whoami</tspan></text>
  </g>
  <g class="mono" clip-path="url(#c2)">
    <text class="ok" x="34" y="106">Youssef Aboukir · security researcher</text>
  </g>
  <g class="mono" clip-path="url(#c3)">
    <text x="34" y="142"><tspan class="usr">onevilx</tspan><tspan class="dim">@1337</tspan><tspan class="sgl">:~$ </tspan><tspan class="cmd">cat credits.txt</tspan></text>
  </g>
  <g class="mono" clip-path="url(#c4)">
    <text class="info" x="34" y="172">3 published GitHub Security Advisories · all credited</text>
  </g>
  <g class="mono" clip-path="url(#c5)">
    <text x="34" y="208"><tspan class="usr">onevilx</tspan><tspan class="dim">@1337</tspan><tspan class="sgl">:~$ </tspan><tspan class="cmd">./hunt --scope web</tspan></text>
  </g>
  <g class="mono" clip-path="url(#c6)">
    <text class="mag" x="34" y="238">[+] every finding I'm allowed to publish, I publish</text>
  </g>
  <rect id="cur" x="502" y="224" width="9" height="17" fill="#7ee787"/>

  <rect x=".5" y=".5" width="919" height="279" rx="12" fill="none" stroke="url(#edge)" stroke-width="1"/>
</svg>
